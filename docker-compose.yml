version: '3.8'

services:
  # INFRASTRUCTURE
  postgres:
    image: postgres:15-alpine
    container_name: campusos-postgres
    environment:
      POSTGRES_USER: campusos
      POSTGRES_PASSWORD: campusospassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - campusos-net
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: campusos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - campusos-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: campusos-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - campusos-net

  redis:
    image: redis:7-alpine
    container_name: campusos-redis
    ports:
      - "6379:6379"
    networks:
      - campusos-net

  zipkin:
    image: openzipkin/zipkin
    container_name: campusos-zipkin
    ports:
      - "9411:9411"
    networks:
      - campusos-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: campusos-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - campusos-net
    restart: unless-stopped

  # BACKEND SERVICES
  eureka-server:
    image: eclipse-temurin:21-jre-alpine
    container_name: campusos-eureka
    volumes:
      - ./services/eureka-server/target:/app
    command: sh -c "java -jar /app/*.jar"
    ports:
      - "8761:8761"
    networks:
      - campusos-net

  api-gateway:
    image: eclipse-temurin:21-jre-alpine
    container_name: campusos-gateway
    depends_on:
      - eureka-server
    volumes:
      - ./services/api-gateway/target:/app
    command: sh -c "java -jar /app/*.jar"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - FRONTEND_URL=http://frontend:5173
      - JWT_SECRET=${JWT_SECRET:-campusos_super_secret_key_change_in_production_min32ch}
    ports:
      - "8080:8080"
    networks:
      - campusos-net

  auth-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: campusos-auth
    depends_on:
      - eureka-server
      - postgres
      - kafka
    # Dış SMTP (smtp.gmail.com) çözümlemesi için açık DNS sunucuları —
    # Docker'ın gömülü çözümleyicisindeki kesintili UnknownHostException'ı önler.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./services/auth-service/target:/app
    command: sh -c "java -jar /app/*.jar"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@isikcampusos.local}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-false}
      - MAIL_SMTP_STARTTLS=${MAIL_SMTP_STARTTLS:-false}
      - MAIL_SMTP_STARTTLS_REQUIRED=${MAIL_SMTP_STARTTLS_REQUIRED:-false}
      - MAIL_ENABLED=${MAIL_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:-campusos_super_secret_key_change_in_production_min32ch}
      # Sistem yöneticisi seed parolası — üretimde host ortam değişkeniyle override edin.
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-Admin123!}
    networks:
      - campusos-net

  profile-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: campusos-profile
    depends_on:
      - eureka-server
      - postgres
      - kafka
    volumes:
      - ./services/profile-service/target:/app
    command: sh -c "java -jar /app/*.jar"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/profile_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - campusos-net

  club-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: campusos-club
    depends_on:
      - eureka-server
      - postgres
      - kafka
    volumes:
      - ./services/club-service/target:/app
    command: sh -c "java -jar /app/*.jar"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/club_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT_SECRET=${JWT_SECRET:-campusos_super_secret_key_change_in_production_min32ch}
    networks:
      - campusos-net

  notification-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: campusos-notification
    depends_on:
      - eureka-server
      - postgres
      - kafka
    volumes:
      - ./services/notification-service/target:/app
    command: sh -c "java -jar /app/*.jar"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT_SECRET=${JWT_SECRET:-campusos_super_secret_key_change_in_production_min32ch}
    networks:
      - campusos-net

  facility-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: campusos-facility
    depends_on:
      - eureka-server
      - postgres
    volumes:
      - ./services/facility-service/target:/app
    command: sh -c "java -jar /app/*.jar"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/facility_db
      - JWT_SECRET=${JWT_SECRET:-campusos_super_secret_key_change_in_production_min32ch}
    networks:
      - campusos-net

  food-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: campusos-food
    depends_on:
      - eureka-server
      - postgres
      - kafka
    volumes:
      - ./services/food-service/target:/app
    command: sh -c "java -jar /app/*.jar"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/food_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT_SECRET=${JWT_SECRET:-campusos_super_secret_key_change_in_production_min32ch}
    networks:
      - campusos-net

  # FRONTEND
  frontend:
    image: node:20-alpine
    container_name: campusos-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_API_PROXY_TARGET=http://api-gateway:8080
    networks:
      - campusos-net

networks:
  campusos-net:
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: infra_postgres_data
