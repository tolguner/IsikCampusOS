server:
  port: 8081
 
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: auth-service
 
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: ${SPRING_DATASOURCE_USERNAME:campusos}
    password: ${SPRING_DATASOURCE_PASSWORD:campusospassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 2000
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          # Bağlantı/okuma/yazma zaman aşımları (ms) — yavaş ya da askıda kalan
          # SMTP bağlantısında uzun bekleme yerine temiz/hızlı hata verir.
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
 
app:
  mail:
    from: ${MAIL_FROM:no-reply@isikcampusos.local}
    enabled: ${MAIL_ENABLED:true}
 
eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
 
logging:
  level:
    com.isik.kampusos.kimlik: DEBUG
 
security:
  jwt:
    # JWT secret environment variable'dan okunur — API Gateway ile AYNI değer olmalı.
    secret: ${JWT_SECRET}
    expiration: 86400000
