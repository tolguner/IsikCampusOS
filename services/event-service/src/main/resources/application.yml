server:
  port: 8089

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5433/event_db
    username: campusos
    password: campusospassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    # Auth Service ve API Gateway ile AYNI değer olmalı
    secret: ${JWT_SECRET:campusos_super_secret_key_change_in_production_min32ch}
