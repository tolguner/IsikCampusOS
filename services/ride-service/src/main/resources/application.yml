server:
  port: 8088

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ride-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ride_db
    username: ${SPRING_DATASOURCE_USERNAME:campusos}
    password: ${SPRING_DATASOURCE_PASSWORD:campusospassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    secret: ${JWT_SECRET}

# Gerçek yol-ağı rota motoru (OSRM). Varsayılan: herkese açık demo sunucu.
# Üretimde kendi OSRM container'ına çevrilir; erişilemezse haversine fallback devreye girer.
rota:
  osrm:
    url: ${ROTA_OSRM_URL:https://router.project-osrm.org}
