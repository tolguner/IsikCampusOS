server:
  port: 8088

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ride-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ride_db
    username: campusos
    password: campusospassword
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc29b945279b945279b945279b945279b945279b}

# Gerçek yol-ağı rota motoru (OSRM). Varsayılan: herkese açık demo sunucu.
# Üretimde kendi OSRM container'ına çevrilir; erişilemezse haversine fallback devreye girer.
rota:
  osrm:
    url: ${ROTA_OSRM_URL:https://router.project-osrm.org}

# Ehliyet görseli analizi (Google Gemini vision). Anahtar yoksa analiz devre dışı kalır;
# alanlar elle girilmeye devam eder (akış bozulmaz).
ehliyet:
  analiz:
    api-key: ${EHLIYET_ANALIZ_API_KEY:}
    url: ${EHLIYET_ANALIZ_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${EHLIYET_ANALIZ_MODEL:gemini-2.0-flash}
