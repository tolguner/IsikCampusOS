server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # Öğrenci yönetimi — ROLE_REGISTRAR gerektirir (Auth Service içinde korumalı)
        - id: student-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/students/**
          filters:
            - AuthenticationFilter

        # Internal kullanıcı bilgisi — toplu kullanıcı sorgulama (event-service vb.)
        - id: user-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - AuthenticationFilter

        - id: certificate-verification-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/certificates/**

        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/v1/profiles/**
          filters:
            - AuthenticationFilter

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/v1/events/**
          filters:
            - AuthenticationFilter

        - id: club-service
          uri: lb://event-service
          predicates:
            - Path=/api/v1/clubs/**
          filters:
            - AuthenticationFilter

        - id: notification-service
          uri: lb://event-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - AuthenticationFilter

        - id: academic-staff-service
          uri: lb://event-service
          predicates:
            - Path=/api/v1/academic-staff/**
          filters:
            - AuthenticationFilter

        - id: frontend
          uri: http://localhost:5173
          predicates:
            - Path=/**

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    # JWT secret environment variable'dan okunur.
    # Başlatırken: $env:JWT_SECRET="your-very-long-secret-min-32-chars" (PowerShell)
    # Ya da: set JWT_SECRET=your-very-long-secret (CMD)
    secret: ${JWT_SECRET:campusos_super_secret_key_change_in_production_min32ch}
