server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:8080"
              - "http://127.0.0.1:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/kimlik/**

        # Öğrenci yönetimi — ROLE_REGISTRAR gerektirir (Kimlik Servisi içinde korumalı)
        - id: student-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/ogrenciler/**
          filters:
            - KimlikDogrulama

        # Internal kullanıcı bilgisi — toplu kullanıcı sorgulama
        - id: user-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/kullanicilar/**
          filters:
            - KimlikDogrulama

        - id: certificate-verification-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/sertifikalar/**

        - id: profile-avatar-service
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/v1/profiller/*/avatar

        - id: profile-service
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/v1/profiller/**
          filters:
            - KimlikDogrulama

        - id: etkinlik-service
          uri: lb://CLUB-SERVICE
          predicates:
            - Path=/api/v1/etkinlikler/**
          filters:
            - KimlikDogrulama

        - id: club-service
          uri: lb://CLUB-SERVICE
          predicates:
            - Path=/api/v1/kulupler/**
          filters:
            - KimlikDogrulama

        # SKS toplu duyuru ucu club-service'te kalır (kulüp başkanı verisi orada — fan-out)
        - id: notification-announcement-service
          uri: lb://CLUB-SERVICE
          predicates:
            - Path=/api/v1/bildirimler/duyurular
            - Method=POST
          filters:
            - KimlikDogrulama

        # Bildirim okuma/işaretleme notification-service'te
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/bildirimler/**
          filters:
            - KimlikDogrulama

        - id: yonetim-service
          uri: lb://CLUB-SERVICE
          predicates:
            - Path=/api/v1/yonetim/**
          filters:
            - KimlikDogrulama

        - id: academic-staff-service
          uri: lb://CLUB-SERVICE
          predicates:
            - Path=/api/v1/akademik-kadro/**
          filters:
            - KimlikDogrulama

        - id: facility-service
          uri: lb://FACILITY-SERVICE
          predicates:
            - Path=/api/v1/tesisler/**
          filters:
            - KimlikDogrulama

        - id: facility-resource-service
          uri: lb://FACILITY-SERVICE
          predicates:
            - Path=/api/v1/tesis-kaynaklari/**
          filters:
            - KimlikDogrulama

        - id: facility-admin-service
          uri: lb://FACILITY-SERVICE
          predicates:
            - Path=/api/v1/tesis-yonetim/**
          filters:
            - KimlikDogrulama

        - id: frontend
          uri: ${FRONTEND_URL:http://localhost:5173}
          predicates:
            - Path=/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    # JWT secret zorunlu olarak environment variable'dan okunur.
    secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc29b945279b945279b945279b945279b945279b}
