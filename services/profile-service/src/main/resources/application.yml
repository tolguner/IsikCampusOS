server:
  port: 8082
 
spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:postgresql://localhost:5433/profile_db
    username: ${SPRING_DATASOURCE_USERNAME:campusos}
    password: ${SPRING_DATASOURCE_PASSWORD:campusospassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: profile-service-group
 
eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
